name: Supabase keep-alive

# Free Supabase projects are paused after ~7 days without activity.
# This pings the database every 3 days so "Leman App" stays awake.
on:
  schedule:
    - cron: "37 6 */3 * *"   # every 3 days, about 07:37 / 08:37 Swiss time
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          # Reuse the public URL and publishable key already in config.js
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.js | head -1)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' config.js | head -1)
          CODE=$(curl -s -o /tmp/resp.txt -w '%{http_code}' \
            "$URL/rest/v1/lb_docs?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"
          # A failure here (e.g. project already paused) makes GitHub email you
          [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]
