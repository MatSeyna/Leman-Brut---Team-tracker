name: Daily stats snapshot

on:
  schedule:
    - cron: "23 4 * * *"   # every day, about 05:23 / 06:23 Swiss time
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      only_analytics:
        description: "Only refresh the large-sample disposition source (quick)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: DEBUG dump raw pages
        run: python scripts/debug_dump.py

      - uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_html/
